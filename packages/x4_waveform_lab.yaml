# Calibration package for the boiler configuration (x4_display, ds, ota_hold).
# Raw rail semantics are experimental. No automatic repeat or boot-time drive.
xteink:
  capture_panel_mtp: true

switch:
  - platform: template
    name: "Waveform Factory Prime On Cold Start"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_bw_factory_prime(true);
    turn_off_action:
      - lambda: id(x4_display).set_bw_factory_prime(false);
  - platform: template
    id: waveform_lab
    name: "Waveform Calibration"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: waveform_take_control
    turn_off_action:
      - script.execute: waveform_release_control
  - platform: template
    name: "Waveform Vertical Window Experiment"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_vertical_window(true);
    turn_off_action:
      - lambda: id(x4_display).set_vertical_window(false);
  - platform: template
    name: "Waveform Cropped Upload Experiment"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_cropped_upload(true);
    turn_off_action:
      - lambda: id(x4_display).set_cropped_upload(false);
  - platform: template
    name: "Waveform Detailed Logging"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_detailed_logging(true);
    turn_off_action:
      - lambda: id(x4_display).set_detailed_logging(false);

button:
  - platform: template
    name: "Waveform Rebuild B-W Starts"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).run_calibration(true);
  - platform: template
    name: "Waveform Repeat With Held References"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_calibration(false);
  - platform: template
    name: "Waveform Rotate Candidates"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_calibration(false, true);
  - platform: template
    name: "Waveform Full Panel Pulse"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).run_calibration(false, 0, true);

  - platform: template
    name: "Waveform Power Off Pumps"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).calibration_power_off();
  - platform: template
    name: "Waveform Export Binary LUTs"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_calibration_waveforms();
  - platform: template
    name: "Waveform Export Timing"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_calibration_timing();
  - platform: template
    name: "Waveform Export Panel Factory Memory"
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_panel_mtp();

  - platform: template
    name: "Waveform Clear To White"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(1);

  - platform: template
    name: "Waveform Clear To Black"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(2);

  - platform: template
    name: "Waveform Show Known Image"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(3);

  - platform: template
    name: "Waveform Show Random Edges"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(4, esphome::random_uint32());

  - platform: template
    name: "Waveform Repeat Last B-W Image"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).repeat_calibration_image();
  - platform: template
    name: "Waveform Show Dithered Landscape"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(5);
  - platform: template
    name: "Waveform Show Grayscale Landscape"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(6);

script:
  - id: waveform_take_control
    mode: single
    then:
      - script.wait: waveform_release_control
      - deep_sleep.prevent: ds
      - lambda: |-
          id(user_requested_display) = true;
          id(timer_wake) = false;
      - script.stop: condition_display
      - script.stop: sleep_after_timer_refresh
      - script.stop: timer_wake_fail_safe
      - script.stop: interactive_sleep
      - script.stop: prepare_display_for_sleep
      - script.stop: connection_timeout
      - script.stop: queue_overview_refresh
      - script.stop: queue_heating_refresh
      - switch.turn_on: ota_hold
      - lvgl.pause:
      - lambda: |-
          if (!id(x4_display).begin_calibration()) {
            ESP_LOGE("waveform_lab", "Could not acquire display");
          }
  - id: waveform_release_control
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_busy();
      - lambda: id(x4_display).end_calibration();
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_active() || id(x4_display).calibration_exit_failed();
      - if:
          condition:
            lambda: return id(x4_display).calibration_active();
          then:
            - switch.template.publish:
                id: waveform_lab
                state: ON
            - logger.log:
                level: ERROR
                format: "Calibration retained: power-off was not confirmed"
          else:
            - lambda: id(x4_display).begin_virtual_update();
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 250ms
            - lambda: id(x4_display).end_virtual_update(true);
            - deep_sleep.allow: ds
            - switch.turn_off: ota_hold
            - script.execute: interactive_sleep

select:
  - platform: template
    name: "Rendering Mode Request"
    entity_category: diagnostic
    optimistic: true
    initial_option: "B-W Dither"
    options:
      - "B-W Dither"
      - "Single Settle - Awaiting Calibration"
      - "Dither Then Settle - Awaiting Calibration"
    set_action:
      - lambda: |-
          const int mode = x == "B-W Dither" ? 0 : x == "Single Settle - Awaiting Calibration" ? 1 : 2;
          id(x4_display).set_rendering_mode(mode);
  - platform: template
    name: "Waveform B-W Preparation"
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Conditioned B-W Drive"
    options:
      - "Factory OTP"
      - "Programmable B-W Drive"
      - "Conditioned B-W Drive"
    on_value:
      - lambda: |-
          id(x4_display).set_bw_preparation(x != "Factory OTP");
          id(x4_display).set_bw_conditioned(x == "Conditioned B-W Drive");

sensor:
