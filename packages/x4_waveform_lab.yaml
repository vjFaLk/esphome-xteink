number:
  - platform: template
    name: "G1 Frames"
    device_id: lab_stable_gray
    entity_category: diagnostic
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    initial_value: 3
    on_value:
      - lambda: id(x4_display).set_stable_frames(0, uint8_t(x));

  - platform: template
    name: "G2 Frames"
    device_id: lab_stable_gray
    entity_category: diagnostic
    min_value: 1
    max_value: 30
