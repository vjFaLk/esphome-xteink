# Calibration package for the boiler configuration (x4_display, ds, ota_hold).
# Raw rail semantics are experimental. No automatic repeat or boot-time drive.
esphome:
  devices:
    - id: lab_session
      name: "Calibration"
    - id: lab_bw
      name: "B/W Setup"
    - id: lab_gray
      name: "Gray Tuning"
    - id: lab_stable_gray
      name: "Stable Gray"
    - id: lab_images
      name: "Test Patterns"
    - id: lab_traces
      name: "Waveform Data"

xteink:
  capture_panel_mtp: true

switch:
  - platform: template
    name: "Zone Gray Settle"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_zone_gray_settle(true);
    turn_off_action:
      - lambda: id(x4_display).set_zone_gray_settle(false);

  - platform: template
    name: "Split if Needed"
    device_id: lab_images
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: id(x4_display).set_bw_split_guard(true);
    turn_off_action:
      - lambda: id(x4_display).set_bw_split_guard(false);

  - platform: template
    name: "Factory Prime"
    device_id: lab_bw
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_bw_factory_prime(true);
    turn_off_action:
      - lambda: id(x4_display).set_bw_factory_prime(false);
  - platform: template
    id: waveform_lab
    name: "Calibration"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: waveform_take_control
    turn_off_action:
      - script.execute: waveform_release_control
  - platform: template
    name: "Vertical Window"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_vertical_window(true);
    turn_off_action:
      - lambda: id(x4_display).set_vertical_window(false);
  - platform: template
    name: "Cropped Upload"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_cropped_upload(true);
    turn_off_action:
      - lambda: id(x4_display).set_cropped_upload(false);
  - platform: template
    name: "Detailed Logs"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_detailed_logging(true);
    turn_off_action:
      - lambda: id(x4_display).set_detailed_logging(false);

