# Calibration package for the boiler configuration (x4_display, ds, ota_hold).
# Raw rail semantics are experimental. No automatic repeat or boot-time drive.
esphome:
  devices:
    - id: lab_session
      name: "Calibration"
    - id: lab_bw
      name: "B/W Setup"
    - id: lab_gray
      name: "Gray Tuning"
    - id: lab_stable_gray
      name: "Stable Gray"
    - id: lab_images
      name: "Test Patterns"
    - id: lab_traces
      name: "Waveform Data"

xteink:
  capture_panel_mtp: true

display:
  - id: !extend x4_display
    grayscale_update_margin: 1

touchscreen:
  - id: !extend x4_touch
    on_touch:
      - if:
          condition:
            lvgl.page.is_showing: light_page
          then:
            - lambda: id(x4_display).begin_touch_preview();
    on_release:
      - lambda: id(x4_display).end_touch_preview();

switch:
  - platform: template
    name: "Landscape Demo"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_render_demo(true);
    turn_off_action:
      - if:
          condition:
            lambda: return id(x4_display).set_render_demo(false);
          then:
            - lvgl.widget.redraw:

  - platform: template
    name: "Demo Marker"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_render_demo_marker(true);
    turn_off_action:
      - lambda: id(x4_display).set_render_demo_marker(false);

  - platform: template
    id: waveform_lab
    name: "Calibration"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: waveform_take_control
    turn_off_action:
      - script.execute: waveform_release_control
  - platform: template
    name: "Detailed Logs"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(x4_display).set_detailed_logging(true);
    turn_off_action:
      - lambda: id(x4_display).set_detailed_logging(false);

button:
  - platform: template
    name: "Build Chart"
    device_id: lab_stable_gray
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).run_stable_gray(true);
  - platform: template
    name: "Repeat"
    device_id: lab_stable_gray
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_stable_gray(false);
  - platform: template
    name: "Rotate"
    device_id: lab_stable_gray
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_stable_gray(false, true);

  - platform: template
    name: "Rebuild Chart"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).run_calibration(true);
  - platform: template
    name: "Repeat Chart"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_calibration(false);
  - platform: template
    name: "Rotate Chart"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).run_calibration(false, true);
  - platform: template
    name: "Full Panel Pulse"
    device_id: lab_session
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).run_calibration(false, 0, true);

  - platform: template
    name: "Pumps Off"
    device_id: lab_session
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).calibration_power_off();
  - platform: template
    name: "Export LUTs"
    device_id: lab_traces
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_calibration_waveforms();
  - platform: template
    name: "Export Timing"
    device_id: lab_traces
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_calibration_timing();
  - platform: template
    name: "Export Factory"
    device_id: lab_traces
    entity_category: diagnostic
    on_press:
      - lambda: id(x4_display).log_panel_mtp();

  - platform: template
    name: "Clear White"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(1);

  - platform: template
    name: "Clear Black"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(2);

  - platform: template
    name: "Known Image"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(3);

  - platform: template
    name: "Random Edges"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(4, esphome::random_uint32());

  - platform: template
    name: "Repeat Image"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).repeat_calibration_image();
  - platform: template
    name: "Gray Photo"
    device_id: lab_images
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(6);

  - platform: template
    name: "White Candidates"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(uint8_t(::x4render::TestImage::WhiteCandidates));

  - platform: template
    name: "Neighbor Mixes"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(7);

  - platform: template
    name: "Linear Ramp"
    device_id: lab_gray
    entity_category: diagnostic
    on_press:
      - switch.turn_on: waveform_lab
      - script.wait: waveform_take_control
      - lambda: id(x4_display).show_calibration_image(8);

text:
  - platform: template
    id: lab_shade_sequence
    name: "Shade Sequence"
    device_id: lab_gray
    entity_category: diagnostic
    mode: text
    min_length: 6
    max_length: 6
    pattern: "[1-6]{6}"
    optimistic: false
    restore_value: false
    initial_value: "123456"
    set_action:
      - lambda: |-
          if (id(x4_display).set_shade_sequence(x))
            id(lab_shade_sequence).publish_state(x);
          else
            ESP_LOGW("waveform_lab", "Shade Sequence must include each of 1-6 once");

script:
  - id: waveform_take_control
    mode: single
    then:
      - script.wait: waveform_release_control
      - deep_sleep.prevent: ds
      - lambda: |-
          id(user_requested_display) = true;
          id(timer_wake) = false;
      - script.stop: condition_display
      - script.stop: sleep_after_timer_refresh
      - script.stop: timer_wake_fail_safe
      - script.stop: interactive_sleep
      - script.stop: prepare_display_for_sleep
      - script.stop: connection_timeout
      - script.stop: queue_overview_refresh
      - script.stop: queue_heating_refresh
      - switch.turn_on: ota_hold
      - lvgl.pause:
      - lambda: |-
          if (!id(x4_display).begin_calibration()) {
            ESP_LOGE("waveform_lab", "Could not acquire display");
          }
  - id: waveform_release_control
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_busy();
      - lambda: id(x4_display).end_calibration();
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_active() || id(x4_display).calibration_exit_failed();
      - if:
          condition:
            lambda: return id(x4_display).calibration_active();
          then:
            - switch.template.publish:
                id: waveform_lab
                state: ON
            - logger.log:
                level: ERROR
                format: "Calibration retained: power-off was not confirmed"
          else:
            - lambda: id(x4_display).begin_virtual_update();
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 250ms
            - lambda: id(x4_display).end_virtual_update(true);
            - deep_sleep.allow: ds
            - switch.turn_off: ota_hold
            - script.execute: interactive_sleep

select:
  - platform: template
    id: lab_render_mode
    name: "Render Mode"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: false
    restore_value: false
    initial_option: "B-W Tuned"
    options:
      - "B-W Tuned"
      - "B-W Dither"
      - "Single Settle"
      - "Dither Then Settle"
    set_action:
      - lambda: |-
          const int mode = x == "B-W Tuned" ? 3 : x == "B-W Dither" ? 0 :
                           x == "Single Settle" ? 1 : 2;
          if (id(x4_display).set_rendering_mode(mode)) {
            id(lab_render_mode).publish_state(x);
            id(x4_display).refresh_rendering_mode();
          } else {
            ESP_LOGW("waveform_lab", "No calibrated profile for %s", x.c_str());
          }
    on_value:
      - lambda: |-
          if (x == "B-W Tuned") id(x4_display).set_rendering_mode(3);
sensor:
  - platform: template
    name: "Duration"
    device_id: lab_session
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(x4_display).calibration_duration();
  - platform: template
    name: "Bytes Sent"
    device_id: lab_session
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(x4_display).calibration_bytes();
  - platform: template
    name: "Driven Pixels"
    device_id: lab_session
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(x4_display).calibration_driven();
  - platform: template
    name: "Cycles"
    device_id: lab_session
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(x4_display).calibration_cycles();
text_sensor:
  - platform: template
    name: "Zone Plan"
    device_id: lab_images
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_bw_zones()};

  - platform: template
    name: "Factory Table"
    device_id: lab_bw
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_temperature()};
  - platform: template
    name: "Applied Power"
    device_id: lab_bw
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).panel_power_setup_status()};
  - platform: template
    name: "Test Image"
    device_id: lab_session
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_image()};
  - platform: template
    name: "Result"
    device_id: lab_session
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_result()};
  - platform: template
    name: "Regions"
    device_id: lab_session
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_region()};
  - platform: template
    name: "Shade Order"
    device_id: lab_gray
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_order()};
  - platform: template
    name: "Pipeline"
    device_id: lab_session
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_pipeline()};
  - platform: template
    name: "A Bits"
    device_id: lab_traces
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_waveform(2, false, false)};
  - platform: template
    name: "B Bits"
    device_id: lab_traces
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_waveform(3, false, false)};
  - platform: template
    name: "C Bits"
    device_id: lab_traces
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_waveform(1, false, false)};
  - platform: template
    name: "VCOM Bits"
    device_id: lab_traces
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_waveform(0, false, false)};
  - platform: template
    name: "Patch Order"
    device_id: lab_gray
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(x4_display).calibration_assignments()};

number:
  - platform: template
    name: "Update Margin"
    device_id: lab_session
    entity_category: diagnostic
    unit_of_measurement: "px"
    min_value: 0
    max_value: 2
    step: 1
    mode: slider
    lambda: return id(x4_display).get_grayscale_update_margin();
    update_interval: 1s
    set_action:
      - lambda: id(x4_display).set_grayscale_update_margin(uint8_t(x));

  - platform: template
    name: "G1 Frames"
    device_id: lab_stable_gray
    entity_category: diagnostic
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    initial_value: 3
    on_value:
      - lambda: id(x4_display).set_stable_frames(0, uint8_t(x));

  - platform: template
    name: "G2 Frames"
    device_id: lab_stable_gray
    entity_category: diagnostic
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    initial_value: 5
    on_value:
      - lambda: id(x4_display).set_stable_frames(1, uint8_t(x));

  - platform: template
    name: "G3 Frames"
    device_id: lab_stable_gray
    entity_category: diagnostic
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    initial_value: 7
    on_value:
      - lambda: id(x4_display).set_stable_frames(2, uint8_t(x));

  - platform: template
    name: "A Frames"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    min_value: 1
    max_value: 63
    step: 1
    initial_value: 2
    on_value:
      - lambda: id(x4_display).set_candidate_frames(0, x);
  - platform: template
    name: "B Frames"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    min_value: 1
    max_value: 63
    step: 1
    initial_value: 3
    on_value:
      - lambda: id(x4_display).set_candidate_frames(1, x);
  - platform: template
    name: "C Frames"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    min_value: 1
    max_value: 63
    step: 1
    initial_value: 4
    on_value:
      - lambda: id(x4_display).set_candidate_frames(2, x);
  - platform: template
    name: "A from Black"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(0, x);
  - platform: template
    name: "B from Black"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(1, x);
  - platform: template
    name: "C from Black"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(2, x);
  - platform: template
    name: "A from White"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(3, x);
  - platform: template
    name: "B from White"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(4, x);
  - platform: template
    name: "C from White"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    min_value: 1
    max_value: 254
    step: 1
    set_action:
      - lambda: id(x4_display).set_measured_shade(5, x);
