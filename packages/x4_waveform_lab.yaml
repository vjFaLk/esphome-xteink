text:
  - platform: template
    id: lab_shade_sequence
    name: "Shade Sequence"
    device_id: lab_gray
    entity_category: diagnostic
    mode: text
    min_length: 6
    max_length: 6
    pattern: "[1-6]{6}"
    optimistic: false
    restore_value: false
    initial_value: "123456"
    set_action:
      - lambda: |-
          if (id(x4_display).set_shade_sequence(x))
            id(lab_shade_sequence).publish_state(x);
          else
            ESP_LOGW("waveform_lab", "Shade Sequence must include each of 1-6 once");

script:
  - id: waveform_take_control
    mode: single
    then:
      - script.wait: waveform_release_control
      - deep_sleep.prevent: ds
      - lambda: |-
          id(user_requested_display) = true;
          id(timer_wake) = false;
      - script.stop: condition_display
      - script.stop: sleep_after_timer_refresh
      - script.stop: timer_wake_fail_safe
      - script.stop: interactive_sleep
      - script.stop: prepare_display_for_sleep
      - script.stop: connection_timeout
      - script.stop: queue_overview_refresh
      - script.stop: queue_heating_refresh
      - switch.turn_on: ota_hold
      - lvgl.pause:
      - lambda: |-
          if (!id(x4_display).begin_calibration()) {
            ESP_LOGE("waveform_lab", "Could not acquire display");
          }
  - id: waveform_release_control
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_busy();
      - lambda: id(x4_display).end_calibration();
      - wait_until:
          condition:
            lambda: return !id(x4_display).calibration_active() || id(x4_display).calibration_exit_failed();
      - if:
          condition:
            lambda: return id(x4_display).calibration_active();
          then:
            - switch.template.publish:
                id: waveform_lab
                state: ON
            - logger.log:
                level: ERROR
                format: "Calibration retained: power-off was not confirmed"
          else:
            - lambda: id(x4_display).begin_virtual_update();
            - lvgl.resume:
            - lvgl.widget.redraw:
            - delay: 250ms
            - lambda: id(x4_display).end_virtual_update(true);
            - deep_sleep.allow: ds
            - switch.turn_off: ota_hold
            - script.execute: interactive_sleep

select:
  - platform: template
    id: lab_strip_pattern
    name: "Strip Pattern"
    device_id: lab_images
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Centered"
    options:
      - "Centered"
      - "Distributed"
      - "1 On / 1 Off"
      - "8 On / 8 Off"
      - "Jittered"
      - "Staggered"

  - platform: template
    name: "B/W Texture"
    device_id: lab_images
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Row Repair"
    options:
      - "Bayer"
      - "Column Stable"
      - "Row Repair"
      - "Original Zoned"
    on_value:
      - lambda: |-
          using Mode = ::x4render::BwTexture;
          id(x4_display).set_bw_texture(x == "Column Stable" ? Mode::Columns :
                                      x == "Row Repair" ? Mode::Repair :
                                      x == "Original Zoned" ? Mode::OriginalZoned : Mode::Bayer);

  - platform: template
    name: "After Zones"
    device_id: lab_images
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Off"
    options:
      - "Off"
      - "Idle Wait"
      - "Panel Hold"
    on_value:
      - lambda: |-
          using Mode = ::x4render::ZoneFinish;
          id(x4_display).set_zone_finish(x == "Panel Hold" ? Mode::Hold :
                                        x == "Idle Wait" ? Mode::Wait : Mode::Off);

  - platform: template
    name: "Cold Start"
    device_id: lab_bw
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Panel Power And Clock - Experimental"
    options:
      - "Legacy Setup"
      - "Panel Power - Experimental"
      - "Panel Power And Clock - Experimental"
    set_action:
      - lambda: |-
          id(x4_display).set_panel_power_setup(
            x == "Legacy Setup" ? 0 :
            x == "Panel Power - Experimental" ? 1 : 2);
  - platform: template
    name: "Render Mode"
    device_id: lab_session
    entity_category: diagnostic
    optimistic: true
    initial_option: "B-W Tuned"
    options:
      - "B-W Tuned"
      - "B-W Dither"
      - "Single Settle - Awaiting Calibration"
      - "Dither Then Settle - Awaiting Calibration"
    on_value:
      - lambda: |-
          const int mode = x == "B-W Tuned" ? 3 : x == "B-W Dither" ? 0 :
                           x == "Single Settle - Awaiting Calibration" ? 1 : 2;
          id(x4_display).set_rendering_mode(mode);
  - platform: template
    name: "Gray Dither"
    device_id: lab_gray
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Column Stable"
    options:
      - "Column Stable"
      - "Bayer"
      - "Row Repair"
    on_value:
      - lambda: |-
          using Mode = ::x4render::GrayDither;
          id(x4_display).set_gray_dither(x == "Row Repair" ? Mode::Repair :
                                       x == "Column Stable" ? Mode::Columns : Mode::Bayer);
  - platform: template
    name: "B/W Drive"
    device_id: lab_bw
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Factory Tuned"
    options:
      - "Factory OTP"
      - "Factory Replay"
      - "Factory Tuned"
    on_value:
      - lambda: |-
          id(x4_display).set_bw_mode(x == "Factory OTP" ? 0 : x == "Factory Replay" ? 1 : 2);

  - platform: template
    name: "Temp Source"
    device_id: lab_bw
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_option: "Boot Sample"
    options:
      - "Boot Sample"
      - "Manual"
    on_value:
      - lambda: id(x4_display).set_temp_override(x == "Manual");

