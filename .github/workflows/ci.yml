name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [x4, x3, x4_pro, x4_pro_lvgl]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            examples/.esphome
          key: pio-${{ matrix.example }}-${{ hashFiles('components/xteink/dependencies.json') }}
      - run: pip install esphome
      - run: esphome compile examples/${{ matrix.example }}.yaml

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python3 components/xteink/dependencies/freeink/libs/display/FreeInkDisplay/test/host/run_x4_transport.py
      - run: python3 components/xteink/dependencies/freeink/libs/display/FreeInkDisplay/test/host/run_pro.py
      - run: python3 components/xteink/dependencies/freeink/libs/hardware/XteinkDetect/test/host/run_probe.py
      - run: python3 components/xteink/dependencies/rendering/test/run.py
      - run: git diff --exit-code && git submodule status --recursive
